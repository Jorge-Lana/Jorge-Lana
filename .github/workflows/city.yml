name: GitHub City

on:
  schedule:
    - cron: '23 6 * * *' # Daily at 06:23 UTC (03:23 America/Sao_Paulo).
  workflow_dispatch:

# The third-party generator never receives a repository write token.
permissions: {}

concurrency:
  group: github-city
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'Jorge-Lana/Jorge-Lana' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      city_sha256: ${{ steps.prepare.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          persist-credentials: false

      - name: Generate the city
        uses: Dasmat13/git-world-action@76fe1d0ad8b59801e0352616cd040eece376c8cb
        with:
          github_user_name: Jorge-Lana
          github_token: ${{ secrets.GITHUB_TOKEN }}
          svg_out_path: city-build/gitworld.svg

      - name: Validate, render the dark city, or retain the working flat city
        id: prepare
        run: |
          # The validated flat city remains a usable fallback if the local
          # renderer or its output fails. Never publish an unvalidated image.
          python3 .github/scripts/prepare_city.py city-build/gitworld.svg city-build/flat-validated.svg
          if python3 .github/scripts/render_city.py city-build/flat-validated.svg city-build/dark.svg \
            && python3 .github/scripts/prepare_city.py city-build/dark.svg city-public/gitworld.svg; then
            echo 'Validated dark city selected.'
          else
            echo '::warning::Dark rendering failed; publishing the validated flat fallback.'
            mkdir -p city-public
            cp city-build/flat-validated.svg city-public/gitworld.svg
          fi
          echo "sha256=$(sha256sum city-public/gitworld.svg | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      # Upload exactly the city; upstream also creates an unwanted profile card.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: github-city
          path: city-public/gitworld.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # This fresh job runs no GitWorld code. Checkout credentials are used only
      # by the trusted publication commands and removed by checkout's cleanup.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (node24)
        with:
          name: github-city
          path: ${{ runner.temp }}/github-city-download

      - name: Independently validate the downloaded city
        env:
          CITY_SHA256: ${{ needs.generate.outputs.city_sha256 }}
        run: |
          printf '%s  %s\n' "$CITY_SHA256" "$RUNNER_TEMP/github-city-download/gitworld.svg" | sha256sum --check --strict
          python3 .github/scripts/prepare_city.py \
            "$RUNNER_TEMP/github-city-download/gitworld.svg" \
            "$RUNNER_TEMP/github-city-validated/gitworld.svg"

      - name: Publish only to city-output
        shell: bash
        run: |
          set -euo pipefail
          # An empty successful result means first publication; a network or
          # authorization error must fail rather than replace branch history.
          existing="$(git ls-remote --heads origin refs/heads/city-output)"
          if [[ -n "$existing" ]]; then
            git fetch --no-tags origin refs/heads/city-output
            git switch --create city-output FETCH_HEAD
          else
            git switch --orphan city-output
          fi
          cp "$RUNNER_TEMP/github-city-validated/gitworld.svg" gitworld.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- gitworld.svg
          if git diff --cached --quiet; then
            echo 'City unchanged; nothing to publish.'
            exit 0
          fi
          git -c core.hooksPath=/dev/null commit -m 'Update GitHub City'
          git push origin HEAD:refs/heads/city-output
